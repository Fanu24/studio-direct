name: Deploy configured platform to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      LOCKS_KV_ID: ${{ vars.LOCKS_KV_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      WEB_WORKER_NAME: ${{ vars.WEB_WORKER_NAME }}
      CRAWLER_WORKER_NAME: ${{ vars.CRAWLER_WORKER_NAME }}
      QUEUE_PREFIX: ${{ vars.QUEUE_PREFIX }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_INDEXING_ENABLED: ${{ vars.SITE_INDEXING_ENABLED }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      STRIPE_ENABLED: ${{ vars.STRIPE_ENABLED }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      PRODUCT_INTERNAL_SECRET: ${{ secrets.PRODUCT_INTERNAL_SECRET }}
      SOCIAL_DELIVERY_ENABLED: ${{ vars.SOCIAL_DELIVERY_ENABLED }}
      NEWSLETTER_DELIVERY_ENABLED: ${{ vars.NEWSLETTER_DELIVERY_ENABLED }}
      X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WEB3_CAREER_API_TOKEN: ${{ secrets.WEB3_CAREER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SITE_URL: ''
      - name: Validate and configure production variables
        run: node scripts/configure-deployment.mjs
      - name: Prepare isolated database for build
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --local --persist-to ../../.wrangler/state
      - name: Build on Linux
        working-directory: apps/web
        run: pnpm cf:build
      - name: Apply production schema before deploying new routes
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy workers
        run: |
          pnpm --filter @gaming/crawler exec wrangler deploy
          pnpm --filter @gaming/web exec wrangler deploy
      - name: Synchronize credentials without printing them
        run: node scripts/install-worker-secrets.mjs
      - name: Verify public routes
        run: node scripts/smoke.mjs
